# Проверки, которые CLAUDE.md требует перед коммитом, плюс формат и прод-сборка: на каждый PR и
# на каждый пуш в master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Новый пуш в ту же ветку делает прежний прогон бессмысленным.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Только `npm ci`: lock берётся как есть, двойной `npm install` нужен лишь при его пересборке.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
